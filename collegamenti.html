<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luce nell'Arte - Collegamenti Interdisciplinari</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* --- RESET E BASE --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: #cbd5e1;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- INTESTAZIONE --- */
        .main-header {
            text-align: center;
            padding: 40px 20px 20px 20px;
        }

        .main-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .main-header .subtitle {
            color: #d4af37;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- NAVIGAZIONE HOME --- */
        .nav-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #d4af37;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.3s ease, transform 0.3s ease;
            margin-bottom: 25px;
        }

        .back-btn:hover {
            color: #ffffff;
            transform: translateX(-5px);
        }

        /* --- CONTAINER PRINCIPALE --- */
        .sections-wrapper {
            max-width: 1000px;
            margin: 0 auto 50px auto;
            padding: 0 20px;
            width: 100%;
        }

        /* --- ELENCO SCHEDE VERTICALI --- */
        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .section-card {
            position: relative;
            height: 180px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.4);
            text-decoration: none;
            display: block;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            background-size: cover;
            background-position: center;
        }

        .section-card:hover {
            transform: translateY(-5px);
            border-color: #d4af37;
            box-shadow: 0 12px 30px rgba(212, 175, 55, 0.3);
        }

        /* STRATO AZZURRATO/SCURO SULL'IMMAGINE */
        .section-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(1px);
            transition: background 0.3s ease;
        }

        .section-card:hover::before {
            background: rgba(15, 23, 42, 0.3);
        }

        /* CUBO BLU TRASPARENTE (GLASSMORPHISM) */
        .glass-box {
            position: absolute;
            inset: 20px;
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .section-card:hover .glass-box {
            background: rgba(30, 41, 59, 0.85);
            border-color: #d4af37;
        }

        .glass-box h2 {
            font-family: 'Playfair Display', serif;
            color: #ffffff;
            font-size: 26px;
            letter-spacing: 1px;
        }

        /* IMMAGINI DI SFONDO (Modifica i nomi se necessario) */
        .card-fisica { background-image: url('fisica.jpg'); }
        .card-italiano { background-image: url('italiano.jpg'); }
        .card-filosofia { background-image: url('filosofia.jpg'); }
        .card-energia { background-image: url('energia.jpg'); }

        /* FOOTER */
        .main-footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <header class="main-header">
        <h1>LUCE NELL'ARTE</h1>
        <p class="subtitle">Collegamenti Interdisciplinari</p>
    </header>

    <div class="nav-container">
        <a href="index.html" class="back-btn">&#8592; Torna alla Home</a>
    </div>

    <main class="sections-wrapper">

        <div class="cards-list">
            
            <!-- SCHEDA FISICA -->
            <a href="fisica.html" class="section-card card-fisica">
                <div class="glass-box">
                    <h2>Fisica</h2>
                </div>
            </a>

            <!-- SCHEDA ITALIANO -->
            <a href="italiano.html" class="section-card card-italiano">
                <div class="glass-box">
                    <h2>Italiano</h2>
                </div>
            </a>

            <!-- SCHEDA FILOSOFIA -->
            <a href="filosofia.html" class="section-card card-filosofia">
                <div class="glass-box">
                    <h2>Filosofia</h2>
                </div>
            </a>

            <!-- SCHEDA ENERGIA -->
            <a href="energia.html" class="section-card card-energia">
                <div class="glass-box">
                    <h2>Educazione civica</h2>
                </div>
            </a>

        </div>

    </main>

    <footer class="main-footer">
        <p>Progetto Luce nell'Arte — Percorso Interattivo | Frare Pierpaolo - Liceo Statale Duca degli Abruzzi (TV)</p>
    </footer>

</body>
</html>
